<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Evaluation — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cpath d='M50 20 L59 41 L82 41 L63 55 L70 78 L50 64 L30 78 L37 55 L18 41 L41 41 Z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="flex flex-col md:flex-row min-h-screen">
    <aside class="w-full md:w-64 md:flex-shrink-0 bg-white border-b md:border-b-0 md:border-r border-slate-200 flex flex-row md:flex-col flex-wrap md:flex-nowrap items-center md:items-stretch gap-3 p-3 md:p-5 sticky top-0 md:h-screen md:overflow-y-auto z-50">
      <div class="flex items-center gap-2.5 font-extrabold text-sm truncate max-w-[160px] md:max-w-none md:whitespace-normal md:overflow-visible md:text-clip md:leading-snug md:mb-6">
        <span class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center flex-shrink-0">
          <svg width="15" height="15" viewBox="0 0 100 100" fill="white"><path d="M50 20 L59 41 L82 41 L63 55 L70 78 L50 64 L30 78 L37 55 L18 41 L41 41 Z"/></svg>
        </span>
        <span class="bg-gradient-to-br from-indigo-600 to-violet-600 bg-clip-text text-transparent truncate">Performance Evaluation</span>
      </div>

      <nav id="tabs" class="flex md:flex-col gap-1 md:flex-1 order-3 md:order-none basis-full md:basis-auto w-full md:w-auto overflow-x-auto">
        <button class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition bg-indigo-50 text-indigo-600" data-tab="give" id="tabGive">
          <span>📝</span>Give Feedback
        </button>
        <button class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition text-slate-500 hover:bg-slate-100 hover:text-slate-900" data-tab="mine">
          <span>📊</span>My Feedback
        </button>
      </nav>

      <div class="flex items-center md:block gap-2 ml-auto md:ml-0 order-2 md:order-none md:border-t md:border-slate-200 md:pt-4 md:mt-2">
        <div class="hidden md:block mb-3">
          <div class="font-bold text-sm text-slate-900" id="userName"></div>
          <div class="text-xs text-slate-500" id="userCompany"></div>
        </div>
        <button onclick="logout()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 bg-white hover:border-indigo-400 hover:text-indigo-600 transition md:w-full">Logout</button>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <!-- Give Feedback Tab -->
      <div class="p-5 md:p-9 max-w-3xl" id="tabGiveContent">
        <p class="text-xl font-bold tracking-tight mb-1">Pending Reviews</p>
        <p class="text-slate-500 text-sm mb-5">People you still need to rate this cycle</p>

        <div id="progressLine" class="hidden items-center flex-wrap gap-2 mb-5 max-w-[360px]">
          <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
            <div id="progressFill" class="h-full bg-gradient-to-r from-indigo-600 to-violet-600 rounded-full transition-all" style="width:0%"></div>
          </div>
          <span id="progressLabel" class="text-xs font-semibold text-slate-500 whitespace-nowrap"></span>
        </div>

        <div id="pendingList"></div>

        <!-- Inline form shown when a row is clicked -->
        <div id="feedbackFormWrap" class="hidden">
          <div class="bg-white border border-slate-200 rounded-xl p-5 md:p-6 mt-5 shadow-sm">
            <h3 id="formTitle" class="text-base font-bold mb-5"></h3>
            <div id="paramBlocks"></div>
            <button id="submitBtn" onclick="submitFeedback()"
              class="mt-2 px-5 py-2.5 text-sm font-semibold rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-600/25 hover:opacity-90 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">Submit Feedback</button>
            <p id="formError" class="hidden mt-3 text-center text-sm text-red-600 bg-red-50 rounded-lg py-2 px-3"></p>
          </div>
        </div>
      </div>

      <!-- My Feedback Tab -->
      <div class="hidden p-5 md:p-9 max-w-3xl" id="tabMineContent">
        <p class="text-xl font-bold tracking-tight mb-1">My Feedback History</p>
        <p class="text-slate-500 text-sm mb-5">Scores you've received, per parameter, across cycles</p>
        <div id="historyWrap"></div>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('perf_token');
    const user  = JSON.parse(localStorage.getItem('perf_user') || 'null');

    if (!token || !user) window.location.href = '/';

    document.getElementById('userName').textContent = user.name;
    document.getElementById('userCompany').textContent = user.companyName;

    // Hide "Give Feedback" tab if not a manager
    if (!user.isManager) {
      document.getElementById('tabGive').classList.add('hidden');
      showTab('mine');
    }

    // ── Tab switching ──
    const ACTIVE_CLASSES = ['bg-indigo-50', 'text-indigo-600'];
    const INACTIVE_CLASSES = ['text-slate-500', 'hover:bg-slate-100', 'hover:text-slate-900'];

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => showTab(btn.dataset.tab));
    });

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        const isActive = b.dataset.tab === tab;
        b.classList.toggle('bg-indigo-50', isActive);
        b.classList.toggle('text-indigo-600', isActive);
        b.classList.toggle('text-slate-500', !isActive);
        b.classList.toggle('hover:bg-slate-100', !isActive);
        b.classList.toggle('hover:text-slate-900', !isActive);
      });
      document.getElementById('tabGiveContent').classList.toggle('hidden', tab !== 'give');
      document.getElementById('tabMineContent').classList.toggle('hidden', tab !== 'mine');
      if (tab === 'mine') loadHistory();
    }

    // ── API helper ──
    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/';
    }

    // ── Parameter icons ──
    const PARAM_ICONS = {
      'Ownership': '🎯',
      'Communication': '💬',
      'Quality of Work': '⭐',
      'Initiative': '🚀',
      'Collaboration': '🤝',
    };
    function paramIcon(name) { return PARAM_ICONS[name] || '📌'; }

    // ── Give Feedback ──
    let parameters  = [];
    let activeSubId = null;
    let totalToRate = 0;
    let pendingById = {};

    const CARD_CLASSES = 'bg-white border border-slate-200 rounded-xl p-4 mb-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm hover:border-indigo-400 hover:shadow-md transition cursor-pointer';
    const EMPTY_CLASSES = 'text-center py-14 px-5 text-slate-500 bg-white border border-dashed border-slate-200 rounded-xl';

    async function loadPending() {
      const [pending, params] = await Promise.all([
        api('/api/feedback/pending'),
        api('/api/feedback/parameters'),
      ]);
      if (!pending || !params) return;
      parameters = params;
      totalToRate = pending.length;

      const list = document.getElementById('pendingList');

      if (pending.length === 0) {
        document.getElementById('progressLine').classList.add('hidden');
        list.innerHTML = `<div class="${EMPTY_CLASSES}"><div class="text-3xl mb-2">✅</div><p class="text-sm">All done for this cycle!</p></div>`;
        return;
      }

      pendingById = {};
      pending.forEach(s => { pendingById[s.submission_id] = s.reviewee_name; });

      list.innerHTML = pending.map(s => `
        <div class="${CARD_CLASSES}" id="card-${s.submission_id}" onclick="openForm(${s.submission_id})">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-9 h-9 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs flex-shrink-0">${initials(s.reviewee_name)}</div>
            <div class="min-w-0">
              <strong class="text-sm block truncate">${escHtml(s.reviewee_name)}</strong>
              <span class="text-xs text-slate-500 block truncate">${escHtml(s.reviewee_email)} · ${monthName(s.month)} ${s.year}</span>
            </div>
          </div>
          <button class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 bg-white hover:border-indigo-400 hover:text-indigo-600 transition self-start sm:self-auto">Rate →</button>
        </div>
      `).join('');

      updateProgress();
    }

    function updateProgress() {
      const line = document.getElementById('progressLine');
      if (totalToRate === 0) { line.classList.add('hidden'); line.classList.remove('flex'); return; }
      const remaining = document.querySelectorAll('#pendingList [id^="card-"]').length;
      const done = totalToRate - remaining;
      line.classList.remove('hidden'); line.classList.add('flex');
      document.getElementById('progressFill').style.width = `${(done / totalToRate) * 100}%`;
      document.getElementById('progressLabel').textContent = `${done} of ${totalToRate} rated`;
    }

    function openForm(submissionId) {
      activeSubId = submissionId;
      document.getElementById('formTitle').textContent = `Rating: ${pendingById[submissionId]}`;
      document.getElementById('formError').classList.add('hidden');

      document.getElementById('paramBlocks').innerHTML = parameters.map((p) => `
        <div class="border-b border-slate-200 pb-5 mb-5 last:border-b-0 last:mb-1" id="pb-${p.id}">
          <div class="font-semibold text-sm mb-1">${paramIcon(p.name)} ${escHtml(p.name)}</div>
          <div class="text-xs text-slate-500 mb-3">${escHtml(p.description)}</div>
          <div class="flex gap-1.5 mb-2.5" id="stars-${p.id}">
            ${[1,2,3,4,5].map(n => `<span class="star text-2xl cursor-pointer select-none text-slate-200 hover:scale-125 transition" data-param="${p.id}" data-val="${n}" onclick="setStar(${p.id}, ${n})">★</span>`).join('')}
          </div>
          <textarea id="comment-${p.id}" placeholder="Why this score?" rows="2"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 resize-y min-h-[68px] transition"></textarea>
        </div>
      `).join('');

      document.getElementById('feedbackFormWrap').classList.remove('hidden');
      document.getElementById('feedbackFormWrap').scrollIntoView({ behavior: 'smooth' });
    }

    function setStar(paramId, val) {
      document.querySelectorAll(`[data-param="${paramId}"]`).forEach(s => {
        const active = parseInt(s.dataset.val) <= val;
        s.classList.toggle('text-amber-400', active);
        s.classList.toggle('text-slate-200', !active);
      });
    }

    function getStarVal(paramId) {
      let val = 0;
      document.querySelectorAll(`[data-param="${paramId}"].text-amber-400`).forEach(s => {
        val = Math.max(val, parseInt(s.dataset.val));
      });
      return val;
    }

    async function submitFeedback() {
      const errEl = document.getElementById('formError');
      errEl.classList.add('hidden');

      const scores = parameters.map(p => ({
        parameterId: p.id,
        score:       getStarVal(p.id),
        comment:     document.getElementById(`comment-${p.id}`).value.trim(),
      }));

      for (const s of scores) {
        if (!s.score) {
          errEl.textContent = 'Please rate all parameters';
          errEl.classList.remove('hidden');
          return;
        }
        if (!s.comment) {
          errEl.textContent = 'Please add a comment for each parameter';
          errEl.classList.remove('hidden');
          return;
        }
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const res = await api(`/api/feedback/submit/${activeSubId}`, {
        method: 'POST',
        body: JSON.stringify({ scores }),
      });

      btn.disabled = false;
      btn.textContent = 'Submit Feedback';

      if (res && res.success) {
        document.getElementById('feedbackFormWrap').classList.add('hidden');
        document.getElementById(`card-${activeSubId}`).remove();
        const remaining = document.querySelectorAll('#pendingList [id^="card-"]').length;
        if (remaining === 0) {
          document.getElementById('pendingList').innerHTML =
            `<div class="${EMPTY_CLASSES}"><div class="text-3xl mb-2">✅</div><p class="text-sm">All done for this cycle!</p></div>`;
        }
        updateProgress();
      } else {
        errEl.textContent = (res && res.error) || 'Submission failed';
        errEl.classList.remove('hidden');
      }
    }

    // ── My Feedback History ──
    const SCORE_COLORS = {
      5: 'bg-green-50 text-green-700',
      4: 'bg-blue-50 text-blue-700',
      3: 'bg-amber-50 text-amber-700',
      2: 'bg-orange-50 text-orange-700',
      1: 'bg-red-50 text-red-700',
    };

    async function loadHistory() {
      const wrap = document.getElementById('historyWrap');
      wrap.innerHTML = '<p class="text-slate-500 text-sm">Loading…</p>';

      const data = await api('/api/feedback/received');
      if (!data) return;

      if (data.length === 0) {
        wrap.innerHTML = `<div class="${EMPTY_CLASSES}"><div class="text-3xl mb-2">📭</div><p class="text-sm">No feedback received yet.</p></div>`;
        return;
      }

      // Group by parameter
      const byParam = {};
      data.forEach(row => {
        if (!byParam[row.parameter]) byParam[row.parameter] = [];
        byParam[row.parameter].push(row);
      });

      const overallAvg = data.reduce((sum, r) => sum + r.score, 0) / data.length;
      const ringColor = overallAvg >= 4 ? '#16a34a' : overallAvg >= 3 ? '#b45309' : '#dc2626';
      const cycleCount = new Set(data.map(r => `${r.month}-${r.year}`)).size;

      const hero = `
        <div class="flex flex-col sm:flex-row items-center sm:items-center text-center sm:text-left gap-5 bg-white border border-slate-200 rounded-xl p-6 mb-6 shadow-sm">
          <div class="ring w-[88px] h-[88px]" style="--pct:${(overallAvg / 5) * 100};--ring-color:${ringColor}">
            <span class="ring-value text-xl">${overallAvg.toFixed(1)}</span>
          </div>
          <div>
            <div class="font-bold text-base mb-0.5">Your overall average</div>
            <div class="text-slate-500 text-sm">${data.length} scores across ${cycleCount} cycle${cycleCount === 1 ? '' : 's'}, out of 5</div>
          </div>
        </div>
      `;

      wrap.innerHTML = hero + Object.entries(byParam).map(([param, rows]) => {
        const avg = (rows.reduce((sum, r) => sum + r.score, 0) / rows.length).toFixed(1);
        const chronological = [...rows].reverse(); // rows arrive newest-first; chart reads left-to-right
        return `
        <div class="mb-7">
          <div class="flex items-baseline gap-2.5 mb-2.5">
            <p class="font-bold text-sm">${paramIcon(param)} ${escHtml(param)}</p>
            <span class="text-slate-500 text-xs">avg ${avg} / 5</span>
          </div>
          ${chronological.length > 1 ? `<div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm px-4 pt-3 pb-1 mb-2.5">${sparkline(chronological)}</div>` : ''}
          <div class="bg-white border border-slate-200 rounded-xl overflow-x-auto shadow-sm">
          <table class="w-full text-sm border-collapse min-w-[480px]">
            <thead>
              <tr>
                <th class="text-left px-4 py-3 bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wide border-b border-slate-200">Cycle</th>
                <th class="text-left px-4 py-3 bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wide border-b border-slate-200">Score</th>
                <th class="text-left px-4 py-3 bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wide border-b border-slate-200">Reviewer</th>
                <th class="text-left px-4 py-3 bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wide border-b border-slate-200">Comment</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="hover:bg-slate-50 transition">
                  <td class="px-4 py-3 border-b border-slate-100 align-top">${monthName(r.month)} ${r.year}</td>
                  <td class="px-4 py-3 border-b border-slate-100 align-top"><span class="inline-flex items-center justify-center w-7 h-7 rounded-md font-bold text-sm ${SCORE_COLORS[r.score]}">${r.score}</span></td>
                  <td class="px-4 py-3 border-b border-slate-100 align-top text-slate-500">${escHtml(r.reviewer_name)}</td>
                  <td class="px-4 py-3 border-b border-slate-100 align-top text-slate-500 text-[13px]">${escHtml(r.comment)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          </div>
        </div>
      `;
      }).join('');
    }

    // ── Trend chart ──
    function sparkline(rows) {
      const w = 320, h = 64, padX = 14, padY = 10;
      const n = rows.length;
      const points = rows.map((r, i) => ({
        x: n === 1 ? w / 2 : padX + (i / (n - 1)) * (w - padX * 2),
        y: h - padY - ((r.score - 1) / 4) * (h - padY * 2),
        score: r.score,
      }));
      const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#4f46e5" stroke="#fff" stroke-width="1.5" />`).join('');
      const labels = rows.map((r, i) => `<text x="${points[i].x.toFixed(1)}" y="${h + 12}" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif">${monthName(r.month).slice(0, 3)}</text>`).join('');

      return `
        <svg viewBox="0 0 ${w} ${h + 18}" width="100%" height="${h + 18}" preserveAspectRatio="xMidYMid meet">
          <path d="${path}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          ${dots}
          ${labels}
        </svg>
      `;
    }

    // ── Helpers ──
    function monthName(m) {
      return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1];
    }

    function initials(name) {
      return String(name).trim().split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Init ──
    if (user.isManager) loadPending();
  </script>
</body>
</html>
