<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Evaluation — Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="topbar-brand">Performance Evaluation</span>
      <div class="topbar-user">
        <span id="topbarInfo"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="give" id="tabGive">Give Feedback</button>
      <button class="tab" data-tab="mine">My Feedback</button>
    </nav>

    <!-- Give Feedback Tab -->
    <div class="content" id="tabGiveContent">
      <p class="section-title">Pending Reviews</p>
      <p class="section-sub">People you still need to rate this cycle</p>
      <div class="progress-line hidden" id="progressLine">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <span class="progress-label" id="progressLabel"></span>
      </div>
      <div id="pendingList"></div>

      <!-- Inline form shown when a row is clicked -->
      <div id="feedbackFormWrap" class="hidden">
        <div class="feedback-form">
          <h3 id="formTitle"></h3>
          <div id="paramBlocks"></div>
          <button class="btn btn-primary mt-20" id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>
          <p class="error-msg hidden" id="formError"></p>
        </div>
      </div>
    </div>

    <!-- My Feedback Tab -->
    <div class="content hidden" id="tabMineContent">
      <p class="section-title">My Feedback History</p>
      <p class="section-sub">Scores you've received, per parameter, across cycles</p>
      <div id="historyWrap"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('perf_token');
    const user  = JSON.parse(localStorage.getItem('perf_user') || 'null');

    if (!token || !user) window.location.href = '/';

    document.getElementById('topbarInfo').innerHTML =
      `<strong>${user.name}</strong> · ${user.companyName}`;

    // Hide "Give Feedback" tab if not a manager
    if (!user.isManager) {
      document.getElementById('tabGive').classList.add('hidden');
      showTab('mine');
    }

    // ── Tab switching ──
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => showTab(btn.dataset.tab));
    });

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('tabGiveContent').classList.toggle('hidden', tab !== 'give');
      document.getElementById('tabMineContent').classList.toggle('hidden', tab !== 'mine');
      if (tab === 'mine') loadHistory();
    }

    // ── API helper ──
    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/';
    }

    // ── Give Feedback ──
    let parameters  = [];
    let activeSubId = null;
    let totalToRate = 0;
    let pendingById = {};

    async function loadPending() {
      const [pending, params] = await Promise.all([
        api('/api/feedback/pending'),
        api('/api/feedback/parameters'),
      ]);
      if (!pending || !params) return;
      parameters = params;
      totalToRate = pending.length;

      const list = document.getElementById('pendingList');

      if (pending.length === 0) {
        document.getElementById('progressLine').classList.add('hidden');
        list.innerHTML = `<div class="empty"><div class="icon">✅</div><p>All done for this cycle!</p></div>`;
        return;
      }

      pendingById = {};
      pending.forEach(s => { pendingById[s.submission_id] = s.reviewee_name; });

      list.innerHTML = pending.map(s => `
        <div class="card" id="card-${s.submission_id}" onclick="openForm(${s.submission_id})">
          <div class="card-left">
            <div class="avatar">${initials(s.reviewee_name)}</div>
            <div class="card-info">
              <strong>${escHtml(s.reviewee_name)}</strong>
              <span>${escHtml(s.reviewee_email)} · ${monthName(s.month)} ${s.year}</span>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm">Rate →</button>
        </div>
      `).join('');

      updateProgress();
    }

    function updateProgress() {
      const line = document.getElementById('progressLine');
      if (totalToRate === 0) { line.classList.add('hidden'); return; }
      const remaining = document.querySelectorAll('#pendingList .card').length;
      const done = totalToRate - remaining;
      line.classList.remove('hidden');
      document.getElementById('progressFill').style.width = `${(done / totalToRate) * 100}%`;
      document.getElementById('progressLabel').textContent = `${done} of ${totalToRate} rated`;
    }

    function openForm(submissionId) {
      activeSubId = submissionId;
      document.getElementById('formTitle').textContent = `Rating: ${pendingById[submissionId]}`;
      document.getElementById('formError').classList.add('hidden');

      document.getElementById('paramBlocks').innerHTML = parameters.map((p, i) => `
        <div class="param-block" id="pb-${p.id}">
          <div class="param-name">${escHtml(p.name)}</div>
          <div class="param-desc">${escHtml(p.description)}</div>
          <div class="star-row" id="stars-${p.id}">
            ${[1,2,3,4,5].map(n => `<span class="star" data-param="${p.id}" data-val="${n}" onclick="setStar(${p.id}, ${n})">★</span>`).join('')}
          </div>
          <textarea id="comment-${p.id}" placeholder="Why this score?" rows="2"></textarea>
        </div>
      `).join('');

      document.getElementById('feedbackFormWrap').classList.remove('hidden');
      document.getElementById('feedbackFormWrap').scrollIntoView({ behavior: 'smooth' });
    }

    function setStar(paramId, val) {
      document.querySelectorAll(`[data-param="${paramId}"]`).forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.val) <= val);
      });
    }

    function getStarVal(paramId) {
      let val = 0;
      document.querySelectorAll(`[data-param="${paramId}"].active`).forEach(s => {
        val = Math.max(val, parseInt(s.dataset.val));
      });
      return val;
    }

    async function submitFeedback() {
      const errEl = document.getElementById('formError');
      errEl.classList.add('hidden');

      const scores = parameters.map(p => ({
        parameterId: p.id,
        score:       getStarVal(p.id),
        comment:     document.getElementById(`comment-${p.id}`).value.trim(),
      }));

      for (const s of scores) {
        if (!s.score) {
          errEl.textContent = 'Please rate all parameters';
          errEl.classList.remove('hidden');
          return;
        }
        if (!s.comment) {
          errEl.textContent = 'Please add a comment for each parameter';
          errEl.classList.remove('hidden');
          return;
        }
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const res = await api(`/api/feedback/submit/${activeSubId}`, {
        method: 'POST',
        body: JSON.stringify({ scores }),
      });

      btn.disabled = false;
      btn.textContent = 'Submit Feedback';

      if (res && res.success) {
        document.getElementById('feedbackFormWrap').classList.add('hidden');
        document.getElementById(`card-${activeSubId}`).remove();
        const remaining = document.querySelectorAll('#pendingList .card').length;
        if (remaining === 0) {
          document.getElementById('pendingList').innerHTML =
            `<div class="empty"><div class="icon">✅</div><p>All done for this cycle!</p></div>`;
        }
        updateProgress();
      } else {
        errEl.textContent = (res && res.error) || 'Submission failed';
        errEl.classList.remove('hidden');
      }
    }

    // ── My Feedback History ──
    async function loadHistory() {
      const wrap = document.getElementById('historyWrap');
      wrap.innerHTML = '<p style="color:var(--muted);font-size:.85rem">Loading…</p>';

      const data = await api('/api/feedback/received');
      if (!data) return;

      if (data.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="icon">📭</div><p>No feedback received yet.</p></div>`;
        return;
      }

      // Group by parameter
      const byParam = {};
      data.forEach(row => {
        if (!byParam[row.parameter]) byParam[row.parameter] = [];
        byParam[row.parameter].push(row);
      });

      wrap.innerHTML = Object.entries(byParam).map(([param, rows]) => {
        const avg = (rows.reduce((sum, r) => sum + r.score, 0) / rows.length).toFixed(1);
        return `
        <div style="margin-bottom:28px">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px">
            <p style="font-weight:700;font-size:.95rem">${escHtml(param)}</p>
            <span style="color:var(--muted);font-size:.78rem">avg ${avg} / 5</span>
          </div>
          <div class="table-card">
          <table class="history-table">
            <thead>
              <tr>
                <th>Cycle</th>
                <th>Score</th>
                <th>Reviewer</th>
                <th>Comment</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${monthName(r.month)} ${r.year}</td>
                  <td><span class="score-badge score-${r.score}">${r.score}</span></td>
                  <td style="color:var(--muted)">${escHtml(r.reviewer_name)}</td>
                  <td style="color:var(--muted);font-size:.82rem">${escHtml(r.comment)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          </div>
        </div>
      `;
      }).join('');
    }

    // ── Helpers ──
    function monthName(m) {
      return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1];
    }

    function initials(name) {
      return String(name).trim().split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Init ──
    if (user.isManager) loadPending();
  </script>
</body>
</html>
